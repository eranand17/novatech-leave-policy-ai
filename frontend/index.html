<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaTech Leave Policy AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-container">

        <header class="app-header">
            <h1>NovaTech Leave Policy AI</h1>
            <p>AI Assistant for Leave & Attendance Policy</p>
        </header>

        <main class="chat-container">

            <div id="chat-messages" class="chat-messages">

                <div class="message assistant-message">
                    <div class="message-label">NovaTech AI</div>

                    <div class="message-content">
                        Hello! I can help you with questions about
                        NovaTech's Leave & Attendance Policy.
                    </div>
                </div>

            </div>

            <div class="input-area">

                <textarea
                    id="question-input"
                    placeholder="Ask about NovaTech's leave policy..."
                    rows="2"
                ></textarea>

                <button id="send-button">Send</button>

            </div>

        </main>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
